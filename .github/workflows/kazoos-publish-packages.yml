# Reusable workflow (ADR 0271 §7), called by the publish-packages.yml of every app repository.
#
# Publishes the app on the kazoos-packages branch of the calling repository (ADR 0182 §2, ADR 0219
# §4), so that "kazopkg install <owner>/<repo>" installs it without the Kazo OS Store. For a tag
# v<version> (the app's Version in its [AppManifest] class), it:
#   1. checks the Kazo OS submodule and that the tag is the manifest version;
#   2. checks out the kazoos-packages branch (an orphan branch the first time), so the versions
#      already published stay listed in index.json;
#   3. packs the app there (KazoOsPack), unsigned: packages are signed only in the marketplace
#      repository (ADR 0219), so this workflow has no signing key;
#   4. commits and pushes the branch with the caller's token (the caller grants contents: write).
# A beta version (1.2.1-beta.1) is published too: the OS offers it only to a user already on a
# pre-release (AppPackageIndex.Latest).
name: Publish the Kazo OS packages

on:
  workflow_call:
    inputs:
      app-directory:
        description: Folder of the app project (the one with manifest.json), for example src/Contoso.Notes
        type: string
        required: true
      ref:
        description: Tag v<version> to publish (empty for the ref that started the caller)
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: kazoos-packages-${{ github.repository }}
  cancel-in-progress: false

env:
  APP_DIRECTORY: ${{ inputs.app-directory }}
  PACKAGES_BRANCH: kazoos-packages

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Fetch the Kazo OS submodule
        run: git submodule update --init --depth 1 external/KazoOs

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Check the Kazo OS submodule
        run: bash .github/scripts/check-kazoos-submodule.sh

      - name: Check out the packages branch
        run: |
          if git fetch --depth 1 origin "$PACKAGES_BRANCH"; then
            git worktree add packages FETCH_HEAD
            git -C packages checkout -B "$PACKAGES_BRANCH"
          else
            git worktree add --orphan -b "$PACKAGES_BRANCH" packages
          fi

      - name: Build and pack (Release)
        run: |
          dotnet build "$APP_DIRECTORY" -c Release -t:KazoOsPack -p:KazoOsPackageOutput="$GITHUB_WORKSPACE/packages"

      - name: Check the tag
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: |
          version="$(jq -r .version "$APP_DIRECTORY/manifest.json")"
          tag="${REF#refs/tags/}"
          if [[ "$tag" == v* && "${tag#v}" != "$version" ]]; then
            echo "::error::Tag $tag does not match the app version $version (manifest.json)."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Push the packages branch
        working-directory: packages
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish $VERSION ($COMMIT)"
          git push origin "HEAD:$PACKAGES_BRANCH"
