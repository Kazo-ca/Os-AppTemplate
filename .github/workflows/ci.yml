# CI of the app: builds and tests the Release profile, the Kazo OS packages from nuget.org at the
# version of the submodule (ADR 0176 §4, §6). This is what the Kazo OS Store compiles.
# The steps live in the reusable workflow kazoos-ci.yml of Kazo-ca/Os-AppTemplate (ADR 0271 §7):
# its inputs add a solution, JavaScript tests or end-to-end tests.
name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # The template repository runs its own copy, so a change is tested before it is tagged.
    uses: ./.github/workflows/kazoos-ci.yml
